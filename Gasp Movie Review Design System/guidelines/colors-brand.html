<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 24px;background:var(--surface-page);color:var(--fg-1);font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.sw i{display:block;height:72px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-1)}.sw b{display:block;font:500 13px/1.3 var(--font-sans);margin-top:8px}.sw span{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div class="row"><div class="sw"><i style="background:var(--gasp-red);box-shadow:0 0 24px var(--gasp-red-glow)"></i><b>Gasp Red</b><span>#FF4433</span></div><div class="sw"><i style="background:var(--gasp-red-deep);"></i><b>Red Deep</b><span>#C8241A</span></div><div class="sw"><i style="background:var(--gasp-navy);box-shadow:0 0 24px var(--gasp-navy-glow)"></i><b>Gasp Navy</b><span>#0D3A67</span></div><div class="sw"><i style="background:var(--gasp-navy-400);"></i><b>Navy 400</b><span>#3F7FC4</span></div></div></body></html>
