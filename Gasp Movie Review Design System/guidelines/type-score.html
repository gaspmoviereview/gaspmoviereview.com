<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 24px;background:var(--surface-page);color:var(--fg-1);font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.sw i{display:block;height:72px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-1)}.sw b{display:block;font:500 13px/1.3 var(--font-sans);margin-top:8px}.sw span{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div style="display:flex;gap:48px;align-items:flex-end"><div style="font:var(--type-score);text-shadow:0 0 40px rgba(255,68,51,.35)">8.03</div><div style="font:400 56px/1 var(--font-display);color:var(--fg-2)">6.70</div><div class="lbl">Always 2 decimals. The glow is reserved for the score.</div></div></body></html>
