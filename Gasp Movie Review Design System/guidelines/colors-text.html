<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 24px;background:var(--surface-page);color:var(--fg-1);font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.sw i{display:block;height:72px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-1)}.sw b{display:block;font:500 13px/1.3 var(--font-sans);margin-top:8px}.sw span{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div class="row"><div class="sw"><i style="background:var(--bone-50);"></i><b>Bone 50</b><span>#F4EFEA · fg-1</span></div><div class="sw"><i style="background:var(--bone-300);"></i><b>Bone 300</b><span>#B9B3AD · fg-2</span></div><div class="sw"><i style="background:var(--bone-500);"></i><b>Bone 500</b><span>#858079 · fg-3</span></div><div class="sw"><i style="background:var(--line-1);"></i><b>Line 1</b><span>white 8%</span></div><div class="sw"><i style="background:var(--line-2);"></i><b>Line 2</b><span>white 16%</span></div></div></body></html>
