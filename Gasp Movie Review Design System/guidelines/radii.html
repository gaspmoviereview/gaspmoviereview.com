<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 24px;background:var(--surface-page);color:var(--fg-1);font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.sw i{display:block;height:72px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-1)}.sw b{display:block;font:500 13px/1.3 var(--font-sans);margin-top:8px}.sw span{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div style="display:flex;gap:20px;align-items:center"><div style="text-align:center"><div style="width:84px;height:84px;background:var(--ink-850);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:var(--radius-xs)"></div><div class="lbl" style="margin-top:6px">6</div></div><div style="text-align:center"><div style="width:84px;height:84px;background:var(--ink-850);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:var(--radius-sm)"></div><div class="lbl" style="margin-top:6px">10</div></div><div style="text-align:center"><div style="width:84px;height:84px;background:var(--ink-850);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:var(--radius-card)"></div><div class="lbl" style="margin-top:6px">14</div></div><div style="text-align:center"><div style="width:84px;height:84px;background:var(--ink-850);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:var(--radius-panel)"></div><div class="lbl" style="margin-top:6px">20</div></div><div style="text-align:center"><div style="width:120px;height:36px;background:var(--ink-850);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:999px"></div><div class="lbl" style="margin-top:6px">pill</div></div></div></body></html>
