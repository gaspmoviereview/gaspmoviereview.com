<!-- @dsCard group="Spacing" viewport="700x170" name="Glow & elevation" subtitle="Light comes from accents, not shadows" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 24px;background:var(--surface-page);color:var(--fg-1);font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.sw i{display:block;height:72px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-1)}.sw b{display:block;font:500 13px/1.3 var(--font-sans);margin-top:8px}.sw span{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div style="display:flex;gap:28px;align-items:center;padding:12px 4px"><div style="width:140px;height:96px;border-radius:14px;background:var(--ink-900);box-shadow:inset 0 0 0 1px var(--line-1),var(--shadow-card)"></div><div style="width:140px;height:96px;border-radius:14px;background:var(--ink-900);box-shadow:var(--shadow-glow-red)"></div><div style="width:140px;height:96px;border-radius:14px;background:var(--gasp-navy);box-shadow:var(--shadow-glow-navy)"></div><div style="width:140px;height:96px;border-radius:14px;background:var(--surface-chrome);backdrop-filter:var(--blur-chrome);box-shadow:inset 0 0 0 1px var(--line-2)"></div></div><div class="lbl">card · red glow (focus/score) · navy glow (selected) · glass chrome</div></body></html>
