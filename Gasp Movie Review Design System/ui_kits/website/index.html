<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gasp Movie Review — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>body{min-height:100vh}</style></head><body><div id="root"></div>
<script type="text/babel" src="PageIntro.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ReviewScreen.jsx"></script>
<script type="text/babel" src="ReviewsScreen.jsx"></script>
<script type="text/babel" src="AboutScreen.jsx"></script>
<script type="text/babel" src="ContactScreen.jsx"></script>
<script type="text/babel" src="AuthorScreen.jsx"></script>
<script type="text/babel">
const { SiteHeader, SiteFooter } = window.GaspMovieReviewDesignSystem_ad6a6f;
const PAGES = { Reviews: 'reviews', About: 'about', Author: 'author', Contact: 'contact' };
function App() {
  const [route, setRoute] = React.useState(() => localStorage.getItem('gasp-kit-route') || 'home');
  const [menu, setMenu] = React.useState(false);
  const go = r => { setRoute(r); setMenu(false); localStorage.setItem('gasp-kit-route', r); window.scrollTo(0, 0); };
  const nav = l => go(PAGES[l] || (window.GASP_GENRES.includes(l) ? 'genre:' + l : 'home'));
  const isReview = window.GASP_REVIEWS.some(r => r.slug === route);
  const current = route === 'reviews' || route.startsWith('genre:') || isReview ? 'Reviews' : Object.keys(PAGES).find(k => PAGES[k] === route);
  let screen;
  if (route === 'reviews') screen = <ReviewsScreen key="all" onOpen={go} />;
  else if (route.startsWith('genre:')) screen = <ReviewsScreen key={route} genre={route.slice(6)} onOpen={go} />;
  else if (route === 'about') screen = <AboutScreen onOpen={go} />;
  else if (route === 'contact') screen = <ContactScreen />;
  else if (route === 'author') screen = <AuthorScreen onOpen={go} />;
  else if (isReview) screen = <ReviewScreen key={route} slug={route} onOpen={go} />;
  else screen = <HomeScreen onOpen={go} />;
  return <>
    <SiteHeader assetBase="../../" current={current} menuOpen={menu} onMenuToggle={() => setMenu(!menu)} onNavigate={nav} onHome={() => go('home')} />
    {screen}
    <SiteFooter assetBase="../../" onNavigate={nav} />
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
